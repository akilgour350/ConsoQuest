---
- name: Deploy ConsoQuest
  hosts: localhost
  connection: local
  become: false

  vars:
    repo_path: /root/consoquest
    image_name: consoquest-api
    deployment_name: consoquest-api

  tasks:
    - name: Build new Docker image
      command: >
        docker build -t {{ image_name }}:{{ build_number }}
        {{ repo_path }}/server

    - name: Import image into k3s
      shell: >
        docker save {{ image_name }}:{{ build_number }} |
        k3s ctr images import -

    - name: Update deployment image
      shell: >
        k3s kubectl set image deployment/{{ deployment_name }}
        {{ deployment_name }}={{ image_name }}:{{ build_number }}

    - name: Wait for rollout to complete
      shell: >
        k3s kubectl rollout status deployment/{{ deployment_name }}
        --timeout=60s
      register: rollout_result
      failed_when: rollout_result.rc != 0
      ignore_errors: true

    - name: Rollback deployment
      shell: k3s kubectl rollout undo deployment/{{ deployment_name }}
      when: rollout_result is failed

    - name: Fail pipeline
      fail:
        msg: "Deployment failed and was rolled back.\nPod logs:\n{{ pod_logs.stdout }}"
      when: rollout_result is failed