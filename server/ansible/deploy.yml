---
- name: Deploy ConsoQuest
  hosts: localhost
  connection: local
  become: false

  vars:
    repo_path: /root/consoquest
    image_name: consoquest-api
    deployment_name: consoquest-api

  tasks:
    - name: Build new Docker image
      command: >
        docker build -t {{ image_name }}:{{ build_number }} -t {{ image_name }}:latest {{ repo_path }}/server
      register: build_result

    - name: Import image into k3s
      shell: >
        docker save {{ image_name }}:{{ build_number }} |
        k3s ctr images import -

    - name: Apply k3s manifests
      shell: >
        k3s kubectl apply -f {{ repo_path }}/server/k3s/
      when: build_result is succeeded

    - name: Update deployment image
      shell: >
        k3s kubectl set image deployment/{{ deployment_name }} {{ deployment_name }}={{ image_name }}:{{ build_number }}
      when: build_result is succeeded

    - name: Wait for rollout to complete
      command: >
        k3s kubectl rollout status deployment/{{ deployment_name }} --timeout=120s
      register: rollout_result
      failed_when: rollout_result.rc != 0
      ignore_errors: true

    - name: Check for pods crashing after rollout
      shell: |
        sleep 15
        k3s kubectl get pods -l app={{ deployment_name }} --no-headers | awk '{print $3}' | grep -v Running | grep -c .
      register: bad_pods
      failed_when: bad_pods.stdout | int > 0
      when: rollout_result is succeeded

    - name: Rollback if rollout failed
      command: >
        k3s kubectl rollout undo deployment/{{ deployment_name }}
      when: rollout_result is failed
