apiVersion: apps/v1
kind: Deployment
metadata:
  name: consoquest-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: consoquest-api
  template:
    metadata:
      labels:
        app: consoquest-api
    spec:
      containers:
        - name: consoquest-api
          image: consoquest-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 18080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /status
              port: 18080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3