services:
  postgres:
    image: postgres:alpine
    container_name: postgres-consoquest
    env_file:
      - .env
    ports:
      - "3005:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    image: consoquest-api
    container_name: consoquest-api
    ports:
      - "18080:18080"
    depends_on:
      - postgres

volumes:
  pgdata:
